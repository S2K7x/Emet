<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Emet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" />
    <style>
      :root {
        --ink: #141118; --paper: #fff; --cream: #fdf3dc;
        --yellow: #f6b928; --purple: #6a4bd6; --red: #e03c31; --green: #7fd63a; --orange: #f58231;
        --radius: 28px; --font: "Outfit", system-ui, sans-serif;
      }
      html, body { margin: 0; height: 100%; background: var(--cream); color: var(--ink); font-family: var(--font); overflow: hidden; -webkit-tap-highlight-color: transparent; }
      button, input { font-family: inherit; }

      /* Full-page card, "character sheet" style */
      .hero { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 28px 24px 0; box-sizing: border-box; overflow: hidden; background: var(--hero, var(--yellow)); transition: background .4s; }
      .hero h1, .hero h2 { font-size: clamp(34px, 9vw, 52px); line-height: 1.02; font-weight: 800; margin: 18px 0 6px; letter-spacing: -.02em; }
      .hero .sub { font-size: 16px; opacity: .8; margin: 0; }
      .hero .stage { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; min-height: 0; }
      .hero-char { height: min(42vh, 360px); filter: drop-shadow(0 18px 18px rgba(0,0,0,.18)); transform: translateX(8%); animation: bob 2.4s ease-in-out infinite; }
      @keyframes bob { 50% { transform: translateX(8%) translateY(-8px) rotate(-1.5deg); } }
      .pill { position: absolute; color: var(--ink); left: 0; top: 2%; background: var(--paper); border-radius: 20px; padding: 10px 12px; text-align: center; font-weight: 800; font-size: 15px; line-height: 1.15; box-shadow: 0 6px 16px rgba(0,0,0,.08); }
      .pill b { display: block; font-size: 20px; }
      .stat { text-align: center; margin-bottom: 22px; }
      .stat small { display: block; font-size: 14px; opacity: .8; }
      .stat strong { font-size: 48px; font-weight: 800; letter-spacing: -.02em; }

      /* Curved black "Let's Go" bar */
      .letsgo { position: relative; margin: 0 -24px; padding: 34px 28px calc(26px + env(safe-area-inset-bottom)); background: var(--ink); color: var(--paper); border-radius: 50% 50% 0 0 / 34px 34px 0 0; display: flex; align-items: center; justify-content: space-between; font-size: 20px; font-weight: 800; border: none; cursor: pointer; width: calc(100% + 48px); text-align: left; }
      .letsgo::before { content: "💀"; position: absolute; top: -14px; left: 50%; transform: translateX(-50%); width: 34px; height: 30px; border-radius: 17px 17px 0 0; background: var(--ink); font-size: 14px; line-height: 30px; text-align: center; }
      .letsgo::after { content: "›››"; letter-spacing: 2px; opacity: .9; animation: chev 1.2s steps(3) infinite; }
      @keyframes chev { 0% { opacity: .4; } 100% { opacity: 1; } }
      .letsgo:disabled { color: #777; cursor: default; }

      /* Lobby */
      #lobby .form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
      #lobby input { font-size: 18px; font-weight: 600; padding: 14px 18px; border-radius: 999px; border: none; background: var(--paper); color: var(--ink); width: 100%; box-sizing: border-box; outline: none; }
      #lobby input:focus { box-shadow: 0 0 0 3px var(--ink); }
      #lobby .row { display: flex; gap: 8px; }
      #lobby .row input { flex: 1; min-width: 0; letter-spacing: .2em; text-transform: uppercase; }
      #join:disabled { opacity: .5; cursor: default; }
      #join { border: none; border-radius: 999px; padding: 0 22px; background: var(--ink); color: var(--paper); font-size: 17px; font-weight: 800; cursor: pointer; }
      .skin-arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; border-radius: 50%; border: none; background: var(--paper); color: var(--ink); font-size: 30px; font-weight: 800; line-height: 1; cursor: pointer; box-shadow: 0 6px 0 rgba(0,0,0,.18); }
      .skin-arrow:active { transform: translateY(calc(-50% + 3px)); box-shadow: 0 3px 0 rgba(0,0,0,.18); }
      #skin-prev { left: 0; } #skin-next { right: 0; }
      #skin-bar { position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; align-items: center; white-space: nowrap; }
      #skin-name { background: var(--ink); color: var(--paper); border-radius: 999px; padding: 7px 14px; font-weight: 800; font-size: 15px; }
      #skin-name small { opacity: .65; font-weight: 600; margin-left: 4px; }
      #error { color: var(--ink); font-weight: 600; min-height: 1.2em; }
      #error:not(:empty)::before { content: "⚠ "; }

      /* Role reveal */
      #reveal { display: none; z-index: 5; }
      #reveal .role-kicker { font-weight: 600; font-size: 15px; opacity: .8; margin-top: 12px; }

      /* In game */
      #hud { position: absolute; top: 12px; left: 12px; font-size: 15px; font-weight: 800; display: none; pointer-events: none; background: var(--paper); padding: 8px 14px; border-radius: 999px; box-shadow: 0 6px 16px rgba(0,0,0,.1); }
      #role { position: absolute; top: 12px; right: 12px; font-size: 16px; font-weight: 800; display: none; padding: 8px 14px; border-radius: 999px; color: var(--paper); box-shadow: 0 6px 16px rgba(0,0,0,.12); }
      #role.killer { background: var(--red); }
      #role.innocent { background: var(--green); color: var(--ink); }
      #role.ghost { background: var(--purple); }
      .action { white-space: nowrap; position: absolute; bottom: calc(24px + env(safe-area-inset-bottom)); font-size: 20px; font-weight: 800; padding: 18px 28px; border-radius: 999px; border: none; color: var(--paper); display: none; touch-action: manipulation; cursor: pointer; box-shadow: 0 8px 0 rgba(0,0,0,.25); transition: transform .08s; }
      .action:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 4px 0 rgba(0,0,0,.25); }
      .action:disabled { opacity: .45; box-shadow: none; cursor: default; }
      #start { left: 50%; transform: translateX(-50%); background: var(--ink); z-index: 6; } /* above the end screen for "Play again" */
      #start:active:not(:disabled) { transform: translate(-50%, 4px); }
      #kill { right: 24px; background: var(--red); }
      #report { left: 24px; background: var(--yellow); color: var(--ink); }
      #power { left: 50%; transform: translateX(-50%); background: var(--purple); }
      #power:active:not(:disabled) { transform: translate(-50%, 4px); }
      #power small { display: block; font-size: 12px; font-weight: 600; opacity: .8; }
      #role small { font-weight: 600; opacity: .8; margin-left: 6px; }
      #banner { position: absolute; top: 64px; left: 50%; transform: translateX(-50%); display: none; z-index: 4; background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 999px; font-weight: 800; font-size: 18px; white-space: nowrap; pointer-events: none; box-shadow: 0 8px 20px rgba(0,0,0,.25); }
      #dark { position: absolute; inset: 0; display: none; pointer-events: none; transition: opacity .4s; }
      #clock { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: none; align-items: center; gap: 10px; background: var(--paper); padding: 6px 8px 6px 14px; border-radius: 999px; font-weight: 800; font-size: 15px; box-shadow: 0 6px 16px rgba(0,0,0,.1); pointer-events: none; }
      #clock.urgent #clock-time { color: var(--red); }
      #taskbar { width: 120px; height: 14px; border-radius: 999px; background: #e6dfcf; overflow: hidden; }
      #taskbar i { display: block; height: 100%; width: 0; background: var(--green); transition: width .4s; }
      #tasks { position: absolute; top: 56px; left: 12px; display: none; background: var(--paper); border-radius: 16px; padding: 8px 12px; font-size: 13px; font-weight: 600; line-height: 1.6; box-shadow: 0 6px 16px rgba(0,0,0,.1); pointer-events: none; }
      #tasks b { display: block; font-weight: 800; }
      #tasks .done { text-decoration: line-through; opacity: .45; }
      #use { right: 24px; background: var(--green); color: var(--ink); }
      #use.above { bottom: calc(100px + env(safe-area-inset-bottom)); }
      #use.emergency { background: var(--red); color: var(--paper); }
      #rv-pick { display: none; gap: 10px; margin: 14px 0 4px; flex-wrap: wrap; position: relative; z-index: 2; }
      #rv-pick button { flex: 1 1 140px; border: 3px solid var(--ink); background: var(--paper); color: var(--ink); border-radius: 18px; padding: 10px 12px; font: inherit; text-align: left; cursor: pointer; }
      #rv-pick button.on { background: var(--ink); color: var(--paper); }
      #rv-pick button b { display: block; font-size: 17px; font-weight: 800; }
      #rv-pick button small { font-size: 12px; opacity: .8; }
      #rv-pick-label { font-weight: 800; font-size: 14px; opacity: .85; display: none; margin-top: 10px; }
      @media (max-width: 520px) { #tasks { top: 96px; } #clock { top: 52px; } }
      /* Ghost chat (in game) */
      #gc-toggle { left: 24px; background: var(--purple); }
      #gc-panel { position: absolute; left: 12px; right: 12px; bottom: calc(96px + env(safe-area-inset-bottom)); max-width: 420px; display: none; flex-direction: column; gap: 8px; background: rgba(42,31,80,.94); border-radius: 20px; padding: 12px; z-index: 3; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
      #gc-phrases, #gc-targets { display: flex; flex-wrap: wrap; gap: 6px; }
      #gc-panel button { background: rgba(255,255,255,.16); color: var(--paper); border: 2px solid transparent; border-radius: 999px; padding: 9px 13px; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
      #gc-log { position: absolute; left: 12px; bottom: calc(96px + env(safe-area-inset-bottom)); max-width: min(80vw, 380px); display: flex; flex-direction: column; gap: 4px; pointer-events: none; z-index: 2; }
      #gc-log div { background: rgba(42,31,80,.85); color: var(--paper); padding: 6px 12px; border-radius: 14px; font-size: 14px; font-weight: 600; width: fit-content; animation: gcfade 8s forwards; }
      @keyframes gcfade { 0%, 80% { opacity: 1; } 100% { opacity: 0; } }
      #gc-panel[style*="flex"] ~ #gc-log { display: none; }

      /* Task mini-games */
      #minigame { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; z-index: 4; background: rgba(20,17,24,.35); padding: 16px; box-sizing: border-box; }
      #mg-card { width: min(100%, 380px, 62vh); background: var(--paper); border-radius: 26px; padding: 16px; box-sizing: border-box; box-shadow: 0 16px 40px rgba(0,0,0,.3); display: flex; flex-direction: column; gap: 8px; }
      #mg-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      #mg-title { font-weight: 800; font-size: 20px; }
      #mg-close { border: none; background: var(--ink); color: var(--paper); width: 36px; height: 36px; border-radius: 50%; font-size: 16px; font-weight: 800; cursor: pointer; flex: none; }
      #mg-hint { font-size: 14px; opacity: .7; margin: 0; }
      #mg-status { font-weight: 800; font-size: 16px; text-align: center; min-height: 1.3em; }
      #mg-stage { position: relative; aspect-ratio: 1; border-radius: 18px; background: #f4ecd8; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; touch-action: none; user-select: none; -webkit-user-select: none; }
      #mg-stage.mg-won { outline: 5px solid var(--green); }
      #mg-stage button { font: inherit; cursor: pointer; touch-action: manipulation; }
      .mg-field { display: block !important; }
      .mg-emoji { position: absolute; font-size: 40px; background: none; border: none; padding: 6px; line-height: 1; }
      .mg-wave { width: 100%; height: 50%; }
      .mg-slider { width: 85%; accent-color: var(--ink); height: 32px; }
      .mg-lane { position: relative; width: 88%; height: 70px; border-radius: 999px; background: #bfe6f7; border: 4px solid var(--ink); }
      .mg-zone { position: absolute; top: 0; bottom: 0; background: rgba(43,178,76,.35); }
      .mg-hook { position: absolute; left: 50%; top: -34px; transform: translateX(-50%); font-size: 28px; }
      .mg-fish { position: absolute; top: 50%; margin-top: -20px; font-size: 36px; line-height: 40px; }
      .mg-big { border: none; background: var(--ink); color: var(--paper); font-weight: 800 !important; font-size: 22px !important; padding: 16px 34px; border-radius: 999px; box-shadow: 0 6px 0 rgba(0,0,0,.25); }
      .mg-big:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.25); }
      .mg-ice { font-size: 90px; line-height: 1; transition: transform .1s; }
      .mg-bar { width: 80%; height: 18px; border-radius: 999px; background: #dfe7ee; overflow: hidden; border: 3px solid var(--ink); }
      .mg-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--yellow), var(--red)); }
      .mg-simon { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 78%; aspect-ratio: 1; }
      .mg-pad { border: 4px solid var(--ink); border-radius: 22px; opacity: .45; transition: opacity .08s, transform .08s; }
      .mg-pad.lit { opacity: 1; transform: scale(1.05); }
      .mg-holes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 84%; aspect-ratio: 1; }
      .mg-hole { border: none; border-radius: 50%; background: radial-gradient(#3a2f4a 55%, #6a5a7c 56%); font-size: 36px; }
      .mg-hole.up { animation: pop .12s ease-out; }
      .mg-swirl { width: 86%; aspect-ratio: 1; border-radius: 50%; border: 4px dashed rgba(20,17,24,.3); display: flex; align-items: center; justify-content: center; }
      .mg-pop { font-size: 110px; line-height: 1; pointer-events: none; }
      #mg-stage.mg-cake { background: radial-gradient(circle at 50% 55%, #ffe3ef 0 40%, #f4ecd8 41%); }
      .mg-lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      .mg-lines line { stroke: #ff6fb5; stroke-width: 3; stroke-linecap: round; }
      .mg-dot { position: absolute; width: 12%; aspect-ratio: 1; border-radius: 50%; border: 3px solid var(--ink); background: var(--paper); font-weight: 800 !important; font-size: 16px !important; padding: 0; }
      .mg-dot.on { background: #ff6fb5; color: var(--paper); }
      .shake { animation: shake .3s; }
      @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
      @keyframes pop { from { transform: scale(.4); } }
      #end small { display: block; font-size: 18px; font-weight: 600; letter-spacing: 0; margin-top: 14px; line-height: 1.5; }
      @media (max-width: 520px) { .action { padding: 14px 18px; font-size: 17px; } #power { bottom: calc(96px + env(safe-area-inset-bottom)); } }
      #minimap { position: absolute; top: 60px; right: 12px; width: 132px; display: none; box-sizing: border-box; border: 3px solid var(--ink); border-radius: 14px; background: var(--ink); box-shadow: 0 6px 16px rgba(0,0,0,.15); cursor: pointer; touch-action: manipulation; }
      #minimap.big { top: 50%; left: 50%; right: auto; width: min(92vw, 640px); transform: translate(-50%, -50%); border-width: 4px; border-radius: 22px; z-index: 4; }
      #minimap-backdrop { position: absolute; inset: 0; display: none; z-index: 3; background: rgba(20,17,24,.45); touch-action: none; }
      #net { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); display: none; background: var(--orange); color: var(--paper); padding: 8px 16px; border-radius: 999px; font-weight: 800; z-index: 10; }

      /* Game over */
      #end { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; font-size: clamp(40px, 11vw, 72px); font-weight: 800; line-height: 1; letter-spacing: -.03em; padding: 24px; box-sizing: border-box; pointer-events: none; text-align: center; color: var(--paper); background: color-mix(in srgb, var(--hero, var(--ink)) 92%, transparent); }

      /* Meeting */
      #meeting { position: absolute; inset: 0; display: none; flex-direction: column; gap: 12px; padding: 20px 16px; box-sizing: border-box; background: var(--purple); color: var(--paper); overflow-y: auto; }
      #mt-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
      #mt-title { font-size: 26px; font-weight: 800; line-height: 1.05; letter-spacing: -.01em; }
      #mt-timer { flex: none; background: var(--paper); color: var(--ink); border-radius: 18px; padding: 8px 12px; font-weight: 800; font-size: 15px; text-align: center; }
      #mt-players { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
      .card { display: flex; align-items: center; gap: 10px; padding: 10px 14px 10px 10px; border-radius: 999px; background: var(--paper); border: 3px solid transparent; color: var(--ink); font-size: 16px; font-weight: 800; text-align: left; cursor: pointer; }
      .card.selected { border-color: var(--ink); transform: scale(1.03); }
      .card.dead { opacity: .45; cursor: default; text-decoration: line-through; }
      .card .face { width: 40px; height: 40px; margin: -6px 0; flex: none; }
      .card .face .hero-char { height: 100%; width: 100%; animation: none; transform: none; filter: none; }
      .card .dot { width: 26px; height: 26px; border-radius: 9px; flex: none; box-shadow: inset -6px 0 0 rgba(0,0,0,.15); }
      .card { border-radius: 22px; }
      .card .who { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
      .card .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .card .tags { display: flex; flex-wrap: wrap; gap: 4px; }
      .card .tags:empty { display: none; }
      .tag { font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 999px; white-space: nowrap; line-height: 1.2; }
      .tag.me { background: var(--ink); color: var(--paper); }
      .tag.voted { background: var(--green); color: var(--ink); }
      .tag.votes { background: var(--yellow); color: var(--ink); }
      #mt-actions { display: flex; gap: 8px; flex-wrap: wrap; }
      #mt-actions button { font-size: 17px; font-weight: 800; padding: 14px 20px; border-radius: 999px; border: none; cursor: pointer; }
      #mt-vote { background: var(--ink); color: var(--paper); flex: 1; }
      #mt-skip { background: var(--paper); color: var(--ink); }
      #mt-actions button:disabled, #mt-quick button:disabled { opacity: .4; cursor: default; }
      #mt-log { flex: 1; min-height: 100px; overflow-y: auto; background: rgba(0,0,0,.2); border-radius: 22px; padding: 12px 14px; font-size: 15px; display: flex; flex-direction: column; gap: 6px; }
      #mt-log b { -webkit-text-stroke: .3px rgba(0,0,0,.4); }
      #mt-log .ghost { opacity: .7; font-style: italic; }
      #mt-quick { display: flex; flex-wrap: wrap; gap: 6px; }
      #mt-quick button { background: rgba(255,255,255,.18); color: var(--paper); border: none; border-radius: 999px; padding: 9px 13px; font-size: 15px; font-weight: 600; cursor: pointer; }
      #mt-result { font-size: 24px; font-weight: 800; text-align: center; }
    </style>
  </head>
  <body>
    <div id="lobby" class="hero">
      <h1>Who's lying<br />in the multiverse?</h1>
      <p class="sub">5 to 10 players · 5 minutes of chaos</p>
      <div class="stage">
        <div class="pill">★<b>10</b>max</div>
        <div id="lobby-char"></div>
        <button id="skin-prev" class="skin-arrow" aria-label="Previous character">‹</button>
        <button id="skin-next" class="skin-arrow" aria-label="Next character">›</button>
        <div id="skin-bar"><span id="skin-name"></span></div>
      </div>
      <div class="form">
        <input id="name" placeholder="Your name" maxlength="16" />
        <div class="row">
          <input id="code" placeholder="CODE" maxlength="4" />
          <button id="join">Join</button>
        </div>
        <div id="error"></div>
      </div>
      <button id="create" class="letsgo">Create a room</button>
    </div>
    <div id="reveal" class="hero">
      <div class="role-kicker">Your role</div>
      <h2 id="rv-name"></h2>
      <p class="sub" id="rv-tagline"></p>
      <div id="rv-pick-label"></div>
      <div id="rv-pick"></div>
      <div class="stage">
        <div class="pill" id="rv-icon"></div>
        <div id="rv-char"></div>
      </div>
      <div class="stat"><small id="rv-stat-label">Players</small><strong id="rv-stat"></strong></div>
      <button id="rv-go" class="letsgo">Let's go</button>
    </div>
    <div id="dark"></div>
    <div id="hud"></div>
    <div id="clock"><span id="clock-time"></span><span id="taskbar"><i></i></span></div>
    <div id="tasks"></div>
    <div id="role"></div>
    <div id="minimap-backdrop"></div>
    <canvas id="minimap" title="Map (M)"></canvas>
    <button id="start" class="action">Start game</button>
    <button id="kill" class="action">Kill</button>
    <button id="report" class="action">Report</button>
    <button id="power" class="action"></button>
    <button id="use" class="action"></button>
    <button id="gc-toggle" class="action">💬 Ghost chat</button>
    <div id="gc-panel"><div id="gc-phrases"></div><div id="gc-targets"></div></div>
    <div id="gc-log"></div>
    <div id="banner"></div>
    <div id="meeting">
      <div id="mt-head"><span id="mt-title"></span><span id="mt-timer"></span></div>
      <div id="mt-players"></div>
      <div id="mt-result"></div>
      <div id="mt-actions"><button id="mt-vote">Vote</button><button id="mt-skip">Skip</button></div>
      <div id="mt-log"></div>
      <div id="mt-quick"></div>
    </div>
    <div id="minigame">
      <div id="mg-card">
        <div id="mg-head"><span id="mg-title"></span><button id="mg-close" title="Close (Esc)">✕</button></div>
        <p id="mg-hint"></p>
        <div id="mg-stage"></div>
        <div id="mg-status"></div>
      </div>
    </div>
    <div id="end"></div>
    <div id="net">Reconnecting…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
